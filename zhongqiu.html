<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中秋節快樂 - 專屬祝賀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617; /* 更深邃的夜空藍 */
            font-family: 'Noto Serif TC', serif;
            touch-action: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .interactive-element {
            pointer-events: auto;
        }

        #greeting-card {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 90%;
            width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(245, 158, 11, 0.1);
            transform: translateY(30px) scale(0.95);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            visibility: hidden;
            color: #fef3c7;
        }

        #greeting-card.show {
            transform: translateY(0) scale(1);
            opacity: 1;
            visibility: visible;
        }

        .message {
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        #hint-text {
            position: absolute;
            bottom: 40px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            animation: fadeInOut 3s ease-in-out infinite;
            text-align: center;
            width: 100%;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-5px); }
        }

        #lantern-counter {
            position: absolute;
            top: 25px;
            left: 25px;
            color: #fcd34d;
            font-size: 1.1rem;
            z-index: 20;
            background: rgba(17, 24, 39, 0.7);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(251, 191, 36, 0.4);
            pointer-events: none;
            transition: opacity 1s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
            backdrop-filter: blur(5px);
        }

        #music-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #020617; /* 與背景同色 */
            z-index: 50; /* 在最上層 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #intro-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-text {
            color: #fef3c7;
            font-size: 1.5rem;
            letter-spacing: 4px;
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.5; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

    </style>
</head>
<body>

    <div id="intro-overlay">
        <div class="intro-text">點擊螢幕開啟中秋祝福</div>
        <div class="mt-4 text-gray-400 text-sm tracking-widest">( 請開啟音量 )</div>
    </div>

    <canvas id="bg-canvas"></canvas>

    <!-- ====== 在此加入您的背景音樂 ====== -->
    <!-- 已經為您換上指定的音樂檔案網址 -->
    <audio id="bg-music" loop>
        <source src="https://files.catbox.moe/5rd6ct.mp3" type="audio/mpeg">
    </audio>
    <!-- ================================== -->
    
    <div id="lantern-counter">收集祈福天燈: <span id="count" class="font-bold text-xl ml-1 text-white">0</span> <span class="text-gray-400 text-sm">/ 25</span></div>

    <div id="music-indicator">♪ 點擊畫面播放音樂</div>

    <div id="ui-layer">
        <div id="greeting-card" class="interactive-element flex flex-col items-center">
            <div class="mb-4 drop-shadow-[0_0_15px_rgba(245,158,11,0.5)]">
                <!-- 簡約月亮 Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="#fcd34d" stroke="#f59e0b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </div>
            
            <div class="message text-left text-lg leading-loose md:text-xl font-medium tracking-wide text-gray-200">
                皓月當空，星光璀璨。<br>
                在這美好的中秋佳節，<br>
                願歲歲平安，幸福美滿！<br>
                但願人長久，千里共嬋娟。<br><br>
                <span class="text-[#fcd34d] font-bold text-2xl block text-center mt-2 drop-shadow-[0_0_10px_rgba(245,158,11,0.6)]">祝中秋節快樂！🌕✨</span>
            </div>
            
            <button id="close-btn" class="mt-8 px-8 py-3 rounded-full border border-gray-400/50 text-gray-200 hover:bg-white/10 hover:border-white transition-all text-sm tracking-[0.2em] backdrop-blur-md bg-white/5 shadow-lg">
                收下祝福
            </button>
        </div>

        <div id="hint-text">點擊隨機升起的祈福天燈，收集 25 盞喚醒滿月！</div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // 狀態控制
        let isCardOpen = false;
        let audioStarted = false;

        // ==========================================
        // 背景音樂控制 (保留給您替換)
        // ==========================================
        const bgMusic = document.getElementById('bg-music');
        let hasInteracted = false; // 追蹤是否已經通過首屏互動

        function playBackgroundMusic() {
            if (!audioStarted && bgMusic) {
                // 如果您換了真實的音樂網址，這裡可以控制背景音樂音量 (0.0 ~ 1.0)
                bgMusic.volume = 0.5; 
                bgMusic.play().then(() => {
                    audioStarted = true;
                    const indicator = document.getElementById('music-indicator');
                    if (indicator) indicator.style.opacity = '0';
                }).catch(err => {
                    console.log("瀏覽器需要使用者互動才能播放音樂，或是音樂網址尚未填寫", err);
                });
            }
        }

        // Web Audio API (用於 UI 互動音效 - 如點擊燈籠或煙火的聲音)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function playChime(freq, type = 'sine') {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }

        // ==========================================
        // 視覺特效類別
        // ==========================================
        
        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5;
                this.blinkSpeed = Math.random() * 0.02 + 0.005;
                this.alpha = Math.random();
                this.alphaDir = Math.random() > 0.5 ? 1 : -1;
            }
            update() {
                this.alpha += this.blinkSpeed * this.alphaDir;
                if (this.alpha >= 1) { this.alpha = 1; this.alphaDir = -1; }
                if (this.alpha <= 0.1) { this.alpha = 0.1; this.alphaDir = 1; }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        class Cloud {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.4); // 雲朵分佈在上半部
                this.speed = Math.random() * 0.15 + 0.05;
                this.scale = Math.random() * 0.8 + 0.4;
                this.alpha = Math.random() * 0.05 + 0.02; // 非常淡的雲朵
            }
            update() {
                this.x -= this.speed;
                if (this.x < -300) {
                    this.x = width + 100;
                    this.y = Math.random() * (height * 0.4);
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(0, 0, 60, 0, Math.PI * 2);
                ctx.arc(50, -20, 70, 0, Math.PI * 2);
                ctx.arc(100, 10, 50, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawMountains() {
            // 後層山脈
            ctx.fillStyle = '#0f172a'; // 深藍灰
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.75);
            ctx.bezierCurveTo(width * 0.25, height * 0.65, width * 0.45, height * 0.85, width * 0.65, height * 0.7);
            ctx.bezierCurveTo(width * 0.85, height * 0.55, width * 0.95, height * 0.8, width, height * 0.75);
            ctx.lineTo(width, height);
            ctx.fill();

            // 前層山脈
            ctx.fillStyle = '#020617'; // 幾近黑色
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.85);
            ctx.bezierCurveTo(width * 0.3, height * 0.95, width * 0.5, height * 0.75, width * 0.75, height * 0.85);
            ctx.bezierCurveTo(width * 0.85, height * 0.9, width * 0.95, height * 0.8, width, height * 0.9);
            ctx.lineTo(width, height);
            ctx.fill();
        }

        // 月亮位置與狀態
        let moonPulse = 0;
        let moonX, moonY, baseMoonRadius;
        
        let moonRevealed = false; // 控制滿月是否已出現
        let lanternsCollected = 0; // 記錄收集到的燈籠數量
        const requiredLanterns = 25; // 喚醒月亮需要的燈籠數

        function updateAndDrawMoon() {
            if (!moonRevealed) return; // 如果還沒收集齊燈籠，先隱藏月亮

            moonX = width * 0.8;
            moonY = height * 0.25;
            baseMoonRadius = Math.min(width, height) * 0.12;
            
            // 呼吸燈效果
            moonPulse += 0.03;
            const pulseFactor = Math.sin(moonPulse) * 0.05 + 1; // 0.95 ~ 1.05
            const radius = baseMoonRadius * pulseFactor;

            ctx.save();
            // 月暈漸層
            const gradient = ctx.createRadialGradient(moonX, moonY, radius * 0.5, moonX, moonY, radius * 4);
            gradient.addColorStop(0, 'rgba(253, 230, 138, 0.5)'); 
            gradient.addColorStop(0.2, 'rgba(251, 191, 36, 0.15)'); 
            gradient.addColorStop(1, 'rgba(11, 15, 25, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(moonX, moonY, radius * 4, 0, Math.PI * 2);
            ctx.fill();

            // 月亮本體
            ctx.beginPath();
            ctx.arc(moonX, moonY, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fef3c7'; // 亮白黃
            ctx.shadowBlur = 60 * pulseFactor;
            ctx.shadowColor = '#f59e0b';
            ctx.fill();
            
            // 月亮隕石坑(陰影細節) - 讓月亮看起來更有立體感
            ctx.fillStyle = 'rgba(217, 119, 6, 0.08)';
            ctx.beginPath();
            ctx.arc(moonX - radius*0.3, moonY - radius*0.2, radius*0.2, 0, Math.PI*2);
            ctx.arc(moonX + radius*0.2, moonY + radius*0.4, radius*0.3, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }

        class FloatingLantern {
            constructor() {
                // 在畫面中下半部隨機出現
                this.x = Math.random() * (width - 100) + 50;
                this.y = height + 50;
                this.speedY = -(Math.random() * 2.0 + 1.2); // 緩緩上升的漂浮感，稍微加快以配合收集25盞
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
                this.markedForDeletion = false;
            }
            update() {
                this.y += this.speedY;
                this.wobble += this.wobbleSpeed;
                if (this.y < -100) {
                    this.markedForDeletion = true; // 超出螢幕邊界就刪除
                }
            }
            draw() {
                let currentX = this.x + Math.sin(this.wobble) * 20;
                ctx.save();
                ctx.translate(currentX, this.y);

                // 天燈形狀 (祈福天燈)
                ctx.beginPath();
                ctx.moveTo(-15, -20);
                ctx.quadraticCurveTo(0, -40, 15, -20);
                ctx.lineTo(22, 15);
                ctx.quadraticCurveTo(0, 25, -22, 15);
                ctx.closePath();
                
                // 漸層上色
                const grad = ctx.createLinearGradient(0, -30, 0, 25);
                grad.addColorStop(0, '#ea580c'); // 頂部較紅
                grad.addColorStop(0.7, '#f59e0b'); // 中間橘黃
                grad.addColorStop(1, '#fef3c7'); // 底部亮白(火光)
                
                ctx.fillStyle = grad;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#f59e0b';
                ctx.fill();
                
                // 底座木架
                ctx.beginPath();
                ctx.moveTo(-12, 18);
                ctx.lineTo(12, 18);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#451a03';
                ctx.stroke();

                ctx.restore();
            }
            checkClick(cx, cy) {
                let currentX = this.x + Math.sin(this.wobble) * 20;
                let centerY = this.y;
                // 擴大點擊判定範圍以便於手機操作
                let dx = cx - currentX;
                let dy = cy - centerY;
                if (Math.abs(dx) < 45 && Math.abs(dy) < 55) {
                    return true;
                }
                return false;
            }
        }

        class SkyLantern {
            constructor() {
                this.x = Math.random() * width;
                this.y = height + 50 + Math.random() * 200;
                this.size = Math.random() * 0.4 + 0.4;
                this.speedY = Math.random() * -1 - 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.y += this.speedY;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.6 + this.speedX;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.size, this.size);
                
                // 天燈形狀
                ctx.beginPath();
                ctx.moveTo(-15, -20);
                ctx.quadraticCurveTo(0, -35, 15, -20);
                ctx.lineTo(22, 15);
                ctx.quadraticCurveTo(0, 25, -22, 15);
                ctx.closePath();
                
                // 漸層上色
                const grad = ctx.createLinearGradient(0, -30, 0, 25);
                grad.addColorStop(0, '#ea580c'); // 頂部較紅
                grad.addColorStop(0.7, '#f59e0b'); // 中間橘黃
                grad.addColorStop(1, '#fef3c7'); // 底部亮白(火光)
                
                ctx.fillStyle = grad;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#f59e0b';
                ctx.fill();
                
                // 底座木架
                ctx.beginPath();
                ctx.moveTo(-12, 18);
                ctx.lineTo(12, 18);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#451a03';
                ctx.stroke();

                ctx.restore();
            }
        }

        class Heart {
            constructor() {
                this.x = Math.random() * width;
                this.y = -50 - Math.random() * 100; // 從上方掉落
                this.size = Math.random() * 0.4 + 0.2; // 稍微小一點更精緻
                this.speedY = Math.random() * 1.5 + 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.03 + 0.01;
                this.alpha = Math.random() * 0.6 + 0.4;
                this.color = ['#f472b6', '#fb7185', '#fda4af', '#f87171'][Math.floor(Math.random() * 4)]; // 多種粉紅/紅色系
            }
            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.wobble) * 1.5;
                this.wobble += this.wobbleSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.size, this.size);
                
                ctx.fillStyle = this.color; 
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                // 繪製愛心路徑
                ctx.beginPath();
                ctx.moveTo(0, -5);
                ctx.bezierCurveTo(10, -15, 20, 0, 0, 15);
                ctx.bezierCurveTo(-20, 0, -10, -15, 0, -5);
                ctx.fill();
                
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.015;
                this.gravity = 0.05;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.vy += this.gravity;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        let stars = Array.from({ length: 150 }, () => new Star());
        let clouds = Array.from({ length: 8 }, () => new Cloud());
        
        let floatingLanterns = [];
        let skyLanterns = [];
        let hearts = [];
        let fireworkParticles = [];
        const fireworkColors = ['#f59e0b', '#ef4444', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981'];

        function createFirework(x, y) {
            const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
            for (let i = 0; i < 60; i++) {
                fireworkParticles.push(new Particle(x, y, color));
            }
            playChime(500 + Math.random() * 500, 'triangle');
        }

        function revealMoon() {
            moonRevealed = true;
            
            // 隱藏計數器
            const counterDiv = document.getElementById('lantern-counter');
            if (counterDiv) counterDiv.style.opacity = '0';
            
            // 更改提示文字
            const hintTextDiv = document.getElementById('hint-text');
            if (hintTextDiv) {
                hintTextDiv.innerText = '點擊滿月開啟祝福 🌕';
                // 讓提示文字閃爍引起注意
                hintTextDiv.style.animation = 'none';
                void hintTextDiv.offsetWidth; 
                hintTextDiv.style.animation = 'fadeInOut 1.5s ease-in-out infinite';
            }

            // 喚醒月亮的華麗音效
            playChime(400, 'triangle');
            setTimeout(() => playChime(600, 'triangle'), 200);
            setTimeout(() => playChime(800, 'triangle'), 400);
            setTimeout(() => playChime(1200, 'sine'), 600);
            
            // 在月亮周圍施放慶祝煙火
            setTimeout(() => createFirework(width * 0.8, height * 0.25), 500);
            setTimeout(() => createFirework(width * 0.8 - 100, height * 0.25 + 50), 900);
            setTimeout(() => createFirework(width * 0.8 + 100, height * 0.25 - 50), 1300);
        }

        function animate() {
            // 背景清除與漸層
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, width, height);

            // 繪製背景元素
            stars.forEach(star => { star.update(); star.draw(); });
            clouds.forEach(cloud => { cloud.update(); cloud.draw(); });
            updateAndDrawMoon();
            drawMountains(); // 山脈覆蓋在雲跟星星前面
            
            // 隨機生成浮動祈福天燈 (若月亮還沒出現)
            if (!moonRevealed && Math.random() < 0.05 && floatingLanterns.length < 8) {
                floatingLanterns.push(new FloatingLantern());
            }

            // 月亮出現後的連續點綴效果 (愛心降落與燈籠升起)
            if (moonRevealed) {
                // 持續飄落精緻愛心 (增加機率)
                if (Math.random() < 0.05) {
                    hearts.push(new Heart());
                }
                // 持續升起祈福天燈
                if (Math.random() < 0.015) {
                    skyLanterns.push(new SkyLantern());
                }
                // 開啟祝福卡片後，持續在背景施放煙火 (設定為靜音避免吵雜)
                if (isCardOpen && Math.random() < 0.03) {
                    const fx = Math.random() * width;
                    const fy = Math.random() * (height * 0.5); // 主要在畫面上半部施放
                    createFirework(fx, fy, true);
                }
            }

            // 更新與繪製浮動紅燈籠
            for (let i = floatingLanterns.length - 1; i >= 0; i--) {
                floatingLanterns[i].update();
                floatingLanterns[i].draw();
                if (floatingLanterns[i].markedForDeletion) {
                    floatingLanterns.splice(i, 1);
                }
            }

            // 繪製互動觸發的天燈與愛心
            for (let i = skyLanterns.length - 1; i >= 0; i--) {
                skyLanterns[i].update();
                skyLanterns[i].draw();
                if (skyLanterns[i].y < -100) skyLanterns.splice(i, 1);
            }

            for (let i = hearts.length - 1; i >= 0; i--) {
                hearts[i].update();
                hearts[i].draw();
                if (hearts[i].y > height + 50) hearts.splice(i, 1);
            }

            // 更新煙火
            for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                fireworkParticles[i].update();
                fireworkParticles[i].draw();
                if (fireworkParticles[i].life <= 0) {
                    fireworkParticles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // 啟動動畫迴圈
        animate();

        // UI 與點擊邏輯
        const introOverlay = document.getElementById('intro-overlay');
        const greetingCard = document.getElementById('greeting-card');
        const hintText = document.getElementById('hint-text');
        const closeBtn = document.getElementById('close-btn');

        // 處理開場點擊 (播放音樂並隱藏覆蓋層)
        introOverlay.addEventListener('click', (e) => {
            e.stopPropagation(); // 避免觸發底層畫布的點擊事件
            hasInteracted = true;
            
            // 嘗試播放您的背景音樂
            playBackgroundMusic();
            
            // 初始化音效 API
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            // 播放一個溫柔的開場音效
            playChime(600, 'sine');
            
            // 隱藏開場畫面
            introOverlay.classList.add('hidden');
        });

        // 確保在觸控設備和滑鼠設備上都能觸發畫布互動
        const handleInteraction = (e) => {
            // 如果還沒通過首屏，不處理畫布互動
            if (!hasInteracted) return;

            // 1. 確保您的音樂有播放 (作為備案)
            playBackgroundMusic();
            
            // 在此初始化 AudioContext 以確保能發出點擊音效
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // 如果點擊到 UI 卡片，不做畫布判定
            if (e.target.closest('.interactive-element')) return;

            // 2. 判斷是否點擊浮動紅燈籠 (收集機制)
            let clickedLanternIndex = -1;
            if (!moonRevealed && !isCardOpen) {
                for (let i = floatingLanterns.length - 1; i >= 0; i--) {
                    if (floatingLanterns[i].checkClick(e.clientX, e.clientY)) {
                        clickedLanternIndex = i;
                        break;
                    }
                }
            }

            if (clickedLanternIndex !== -1) {
                // 成功點擊並收集燈籠
                let lantern = floatingLanterns[clickedLanternIndex];
                let lx = lantern.x + Math.sin(lantern.wobble) * 20;
                let ly = lantern.y + lantern.height / 2;
                
                // 在燈籠消失處放個小煙火
                createFirework(lx, ly);
                floatingLanterns.splice(clickedLanternIndex, 1);
                
                lanternsCollected++;
                const countSpan = document.getElementById('count');
                if (countSpan) countSpan.innerText = lanternsCollected;
                
                playChime(700 + lanternsCollected * 50, 'sine'); // 音調隨數量逐漸升高

                // 檢查是否達標喚醒月亮
                if (lanternsCollected >= requiredLanterns) {
                    revealMoon();
                }
                return; // 點到燈籠就不觸發其他畫布點擊事件
            }

            // 3. 判斷是否點擊滿月 (只有在滿月出現後才能點擊)
            if (moonRevealed && !isCardOpen) {
                const distToMoon = Math.hypot(e.clientX - moonX, e.clientY - moonY);
                if (distToMoon <= baseMoonRadius * 2) { // 稍微寬鬆的判定範圍
                    openCard();
                    return; 
                }
            }

            // 4. 如果都沒點到，則在點擊處施放一般煙火
            if (!isCardOpen) {
                createFirework(e.clientX, e.clientY);
            }
        };

        window.addEventListener('pointerdown', handleInteraction);
        
        // 滑鼠移動時，若指到月亮則改變游標形狀，增加互動提示
        window.addEventListener('pointermove', (e) => {
            if (moonRevealed && !isCardOpen) {
                const distToMoon = Math.hypot(e.clientX - moonX, e.clientY - moonY);
                if (distToMoon <= baseMoonRadius * 2) {
                    canvas.style.cursor = 'pointer';
                } else {
                    canvas.style.cursor = 'default';
                }
            } else {
                canvas.style.cursor = 'default';
            }
        });

        function openCard() {
            isCardOpen = true;
            canvas.style.cursor = 'default'; // 開啟後恢復游標
            greetingCard.classList.add('show');
            hintText.style.display = 'none';
            
            // 開卡魔法音效
            playChime(800);
            setTimeout(() => playChime(1000), 150);
            setTimeout(() => playChime(1200), 300);

            // 觸發天燈祈福動畫 (從底部升起，大爆發)
            for(let i=0; i<30; i++) {
                setTimeout(() => {
                    skyLanterns.push(new SkyLantern());
                }, i * 150); // 錯開生成時間，產生源源不絕的感覺
            }

            // 觸發粒子愛心降落 (大爆發)
            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    hearts.push(new Heart());
                }, i * 80);
            }
        }

        closeBtn.addEventListener('click', () => {
            greetingCard.classList.remove('show');
            setTimeout(() => {
                isCardOpen = false;
                hintText.style.display = 'block';
            }, 500); 
            playChime(400);
        });

    </script>
</body>
</html>
